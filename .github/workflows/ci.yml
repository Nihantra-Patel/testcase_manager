name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-testcase-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # pre-commit: lint & format checks
  # ---------------------------------------------------------------------------
  pre-commit:
    runs-on: ubuntu-latest
    name: Pre-commit checks

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # ---------------------------------------------------------------------------
  # Server-side unit tests
  # ---------------------------------------------------------------------------
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" testcase_manager/ > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install -y mariadb-client

      - name: Setup bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python3)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install app
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app testcase_manager $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app testcase_manager
        env:
          CI: 'Yes'

      - name: Build frontend (Vue / Frappe UI)
        working-directory: /home/runner/frappe-bench/apps/testcase_manager/frontend
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app testcase_manager
        env:
          TYPE: server

  # ---------------------------------------------------------------------------
  # UI (Cypress) tests — runs the app's own Cypress specs headlessly via the
  # same `bench run-ui-tests` path the Testcase Manager UI executor uses, so CI
  # and the in-app runner behave identically (incl. video off, see below).
  # No-ops to a green pass when the app ships no specs.
  # ---------------------------------------------------------------------------
  ui-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: UI

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      # Only run the heavy browser job when the app actually ships Cypress specs;
      # otherwise it's a green no-op so the workflow stays valid for spec-less apps.
      - name: Detect UI specs
        id: detect
        run: |
          if ls cypress/integration/*.js >/dev/null 2>&1 || find . -name 'ui_test_*.js' -not -path '*/node_modules/*' | grep -q .; then
            echo "has_specs=true" >> $GITHUB_OUTPUT
          else
            echo "has_specs=false" >> $GITHUB_OUTPUT
            echo "No Cypress specs found in this app — skipping UI tests."
          fi

      - name: Setup Python
        if: steps.detect.outputs.has_specs == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        if: steps.detect.outputs.has_specs == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      # Cache the auto-downloaded Cypress binary across runs. The binary is
      # installed automatically by `bench run-ui-tests` on first use, so
      # contributors never configure Cypress by hand on any OS.
      - name: Cache Cypress binary
        if: steps.detect.outputs.has_specs == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      - name: Add to Hosts
        if: steps.detect.outputs.has_specs == 'true'
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Install MariaDB Client
        if: steps.detect.outputs.has_specs == 'true'
        run: |
          sudo apt update
          sudo apt-get install -y mariadb-client

      - name: Setup bench
        if: steps.detect.outputs.has_specs == 'true'
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python3)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install app
        if: steps.detect.outputs.has_specs == 'true'
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app testcase_manager $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app testcase_manager
        env:
          CI: 'Yes'

      # Cypress logs in with username + password, so the test site must allow it.
      # We do NOT store a plaintext admin_password; instead we provision a
      # dedicated test user with a fresh random password (same helper the in-app
      # runner uses) and pass it via CYPRESS_adminPassword — mirroring the app.
      - name: Provision Cypress test user
        id: cypress_user
        if: steps.detect.outputs.has_specs == 'true'
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site set-config disable_user_pass_login 0
          PW=$(bench --site test_site execute \
            testcase_manager.testcase_manager.ui_executor.provision_cypress_user \
            | tail -n1 | tr -d '"')
          echo "::add-mask::$PW"
          echo "pw=$PW" >> $GITHUB_OUTPUT

      - name: Start bench server
        if: steps.detect.outputs.has_specs == 'true'
        working-directory: /home/runner/frappe-bench
        run: |
          nohup bench --site test_site serve --port 8000 > ~/bench_server.log 2>&1 &
          # Wait for the server to accept connections before launching Cypress.
          for i in $(seq 1 30); do
            curl -sf http://test_site:8000/api/method/ping >/dev/null && break
            sleep 2
          done

      # Run the app's Cypress specs headlessly. `bench run-ui-tests` installs
      # Cypress + plugins automatically (no manual setup); we pass
      # `--config video=false` to match the in-app runner, and the provisioned
      # test user's password via CYPRESS_adminPassword (masked in logs).
      - name: Run UI tests
        if: steps.detect.outputs.has_specs == 'true'
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site run-ui-tests testcase_manager --headless --browser chrome --config video=false
        env:
          CI: 'Yes'
          CYPRESS_adminPassword: ${{ steps.cypress_user.outputs.pw }}
